version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/weights # Map weights dynamically
    deploy:
      resources:
        limits:
          memory: 4G # Adjust based on your machine

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend